<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="TIA S7 Copilot - talk to your PLC-controlled assembly cell">
<title>TIA S7 Copilot</title>
<defs>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="#ffffff" fill-opacity=".05"/></pattern>
  <linearGradient id="bold" x1="0" x2="1"><stop offset="0" stop-color="#00ffb9"/><stop offset="1" stop-color="#00e6dc"/></linearGradient>
  <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ffb9"/><stop offset="1" stop-color="#00a3a3"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#009999" stop-opacity=".35"/><stop offset="1" stop-color="#009999" stop-opacity="0"/></radialGradient>
</defs>
<style>
    .fade { opacity: 0; animation: 9s linear infinite; }
    .q { animation-name: q; } .t { animation-name: t; } .r { animation-name: r; }
    .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .ok { animation-name: ok; }
    @keyframes q  { 0%, 4% { opacity: 0; transform: translateY(8px); } 9%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    @keyframes t  { 0%, 11% { opacity: 0; } 13%, 24% { opacity: 1; } 26%, 100% { opacity: 0; } }
    @keyframes r  { 0%, 25% { opacity: 0; transform: translateY(8px); } 30%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    @keyframes r1 { 0%, 33% { opacity: 0; } 37%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 41% { opacity: 0; } 45%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 49% { opacity: 0; } 53%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes ok { 0%, 57% { opacity: 0; } 61%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .dot { animation: blink 1s ease-in-out infinite; } .dot2 { animation-delay: .15s; } .dot3 { animation-delay: .3s; }
    @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .belt { animation: belt 1.2s linear infinite; }
    @keyframes belt { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } .t { opacity: 0; } .belt, .dot { animation: none; } }
    </style>
<rect width="1280" height="380" rx="24" fill="#000028"/>
<rect width="1280" height="380" rx="24" fill="url(#dots)"/>
<rect x="0" y="375" width="1280" height="5" fill="url(#bold)"/>
<circle cx="1010" cy="190" r="260" fill="url(#halo)"/>

<g transform="translate(64,58) scale(1.0)">
  <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
  <path d="M14 47.5h36" stroke="#000028" stroke-opacity=".28" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
  <g fill="none" stroke="#000028" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 52h16"/><path d="M25 52v-9"/><path d="M25 43l10-17"/><path d="M35 26l11 6"/><path d="M46 32v6"/>
  </g>
  <circle cx="25" cy="43" r="4.6" fill="#000028"/><circle cx="35" cy="26" r="4.6" fill="#000028"/>
  <path d="M41.5 40.5h9" stroke="#000028" stroke-width="4" stroke-linecap="round"/>
  <path d="M49 11.5l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#ffffff"/>
</g>
<text x="146" y="104" font-size="50" font-weight="700" letter-spacing="-1.2" fill="#ffffff">TIA S7 Copilot</text>
<text x="64" y="178" font-size="25" font-weight="600" fill="#ffffff">Talk to your PLC-controlled assembly cell.</text>
<text x="64" y="214" font-size="16.5" fill="#b8b8cc">Natural-language control, live telemetry and energy analytics for a three-arm</text>
<text x="64" y="239" font-size="16.5" fill="#b8b8cc">PCB assembly line driven by an S7-1500 PLC and uArm Swift Pro robots.</text>
<g transform="translate(64,282)"><rect width="129" height="30" rx="15" fill="#13133f" stroke="#2e2e62"/><text x="64" y="19.5" text-anchor="middle" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">S7-1500 · Snap7</text></g><g transform="translate(203,282)"><rect width="159" height="30" rx="15" fill="#13133f" stroke="#2e2e62"/><text x="79" y="19.5" text-anchor="middle" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">TIA Portal Openness</text></g><g transform="translate(372,282)"><rect width="144" height="30" rx="15" fill="#13133f" stroke="#2e2e62"/><text x="72" y="19.5" text-anchor="middle" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">3× uArm Swift Pro</text></g><g transform="translate(525,282)"><rect width="151" height="30" rx="15" fill="#13133f" stroke="#2e2e62"/><text x="76" y="19.5" text-anchor="middle" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">LLM intent routing</text></g><g transform="translate(687,282)"><rect width="70" height="30" rx="15" fill="#13133f" stroke="#2e2e62"/><text x="35" y="19.5" text-anchor="middle" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">FastAPI</text></g>

<g transform="translate(796,48)">
  <rect width="420" height="284" rx="20" fill="#0e0e38"/>
  <rect width="420" height="284" rx="20" fill="none" stroke="#009999" stroke-opacity=".55"/>
  <circle cx="24" cy="24" r="4.5" fill="#ff2640"/><circle cx="40" cy="24" r="4.5" fill="#ffd732"/><circle cx="56" cy="24" r="4.5" fill="#00ffb9"/>
  <text x="396" y="28" text-anchor="end" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9999b3">operator chat</text>

  <g class="fade q"><rect x="166" y="46" width="232" height="38" rx="14" fill="url(#bold)"/>
    <text x="282" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#000028">copilot, set speed to 80%</text></g>

  <g class="fade t"><circle class="dot" cx="34" cy="112" r="4" fill="#00ffb9"/><circle class="dot dot2" cx="48" cy="112" r="4" fill="#00ffb9"/><circle class="dot dot3" cx="62" cy="112" r="4" fill="#00ffb9"/>
    <text x="78" y="116" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#9999b3">classifying → SPEED_CHANGE</text></g>

  <g class="fade r"><rect x="20" y="100" width="380" height="164" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="20" y="100" width="4" height="164" rx="2" fill="#009999"/>
    <text x="40" y="128" font-size="15.5" font-weight="700" fill="#ffffff">✓ Robot speed 50% → 80%</text></g>
  <g class="fade r1"><text x="40" y="158" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d1d1de">DB1.DBD12  prox-1 timer  5500 → 4000 ms</text></g>
  <g class="fade r2"><text x="40" y="182" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d1d1de">DB1.DBD16  prox-3 timer  7000 → 5800 ms</text></g>
  <g class="fade r3"><text x="40" y="206" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d1d1de">cycle 80.0 s → 69.2 s   ·   +7 parts / h</text></g>
  <g class="fade ok"><rect x="40" y="222" width="160" height="26" rx="13" fill="#00ffb9" fill-opacity=".14"/>
    <circle cx="56" cy="235" r="4.5" fill="#00ffb9"/><text x="68" y="239.5" font-family="'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#00ffb9">PLC write verified</text></g>
</g>
</svg>
